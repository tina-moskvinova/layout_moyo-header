<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body>
    <header class="header">
      <!-- <div class="container"> -->
      <a class="img"
          href="https://www.apple.com/ua/"
          target="_blank"
        >
        <img
            src="./images/logo.png"
            alt="MOYO Logo"
            class="logo"
          />
      </a>
      <nav class="nav">
        <ul class="nav__list">
          <li class="nav__item">
            <a
                class="nav__link is-active"
                href="https://www.apple.com/ua/"
              >
                apple
            </a>
          </li>
          <li class="nav__item">
            <a
                class="nav__link"
                href="https://www.apple.com/ua/"
              >
                samsung
            </a>
          </li>
          <li class="nav__item">
            <a
                class="nav__link"
                href="https://www.apple.com/ua/"
              >
                smartphones
            </a>
          </li>
          <li class="nav__item">
            <a
                class="nav__link"
                data-qa="hover"
                href="https://www.apple.com/ua/"
              >
                laptops & computers
            </a>
          </li>
          <li class="nav__item">
            <a
                class="nav__link"
                href="https://www.apple.com/ua/"
              >
                gadgets
            </a>
          </li>
          <li class="nav__item">
            <a
                class="nav__link"
                href="https://www.apple.com/ua/"
              >
                tablets
            </a>
          </li>
          <li class="nav__item">
            <a
                class="nav__link"
                href="https://www.apple.com/ua/"
              >
                photo
            </a>
          </li>
          <li class="nav__item">
            <a
                class="nav__link"
                href="https://www.apple.com/ua/"
              >
                video
            </a>
          </li>
        </ul>
      </nav>
      <!-- </div> -->
    </header>
  </body>
</html>
